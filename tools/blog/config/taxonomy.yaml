# Relevance scoring for the fortnightly editor (CW042, plan section 6.2).
#
# score = sourceWeight (by sourceId, else by category) + sum of keyword weights
#         matched in title + description (each keyword counted once; title
#         matches count double). Items below scoring.threshold in site.json are
#         dropped before the model ranking pass.
#
# Keep this file as the one place relevance is tuned. Keywords are matched
# case-insensitively as substrings, so "biobank" also matches "biobanking".

sourceWeights:
  hta: 5
  mhra: 4
  hra: 4
  nhsbt: 3
  dhsc: 2
  ukhsa: 2
  biobanking: 4
  bbmri-eric: 4
  lab-news: 2
  the-scientist: 1
  elife: 1

categoryWeights:
  regulator: 3
  biobanking: 3
  lab: 2
  science: 1

# Regulator sources whose items can force format B when the model confirms the
# item changes or clarifies an obligation.
regulatorSources:
  - hta
  - mhra
  - hra
  - dhsc
  - nhsbt

