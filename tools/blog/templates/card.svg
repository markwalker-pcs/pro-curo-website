<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="627" viewBox="0 0 1200 627">
  <!-- Pro-curo social card template (CW042). Fixed layout, brand colours only. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F4E79"/>
      <stop offset="1" stop-color="#1A2A3A"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="627" fill="url(#bg)"/>
  <rect x="0" y="0" width="14" height="627" fill="#E8F0FE"/>

  <!-- Logo and series -->
  <rect x="72" y="60" width="72" height="72" rx="12" fill="#FFFFFF"/>
  <image x="80" y="68" width="56" height="56" xlink:href="{{LOGO_DATA_URI}}"/>
  <text x="164" y="92" font-family="{{FONT_FAMILY}}" font-size="30" font-weight="700" fill="#FFFFFF">{{SERIES_NAME}}</text>
  <text x="164" y="124" font-family="{{FONT_FAMILY}}" font-size="20" fill="#C8D8E8">{{SERIES_TAGLINE}}</text>

  <!-- Format label -->
  <rect x="72" y="188" width="{{FORMAT_PILL_WIDTH}}" height="40" rx="20" fill="#E8F0FE"/>
  <text x="{{FORMAT_PILL_TEXT_X}}" y="216" font-family="{{FONT_FAMILY}}" font-size="19" font-weight="700" fill="#1F4E79" text-anchor="middle" letter-spacing="1">{{FORMAT_LABEL}}</text>

  <!-- Title -->
  <text font-family="{{FONT_FAMILY}}" font-size="{{TITLE_SIZE}}" font-weight="700" fill="#FFFFFF">
{{TITLE_LINES}}
  </text>

  <!-- Footer -->
  <line x1="72" y1="540" x2="1128" y2="540" stroke="#2A6BA6" stroke-width="2"/>
  <text x="72" y="582" font-family="{{FONT_FAMILY}}" font-size="22" fill="#C8D8E8">{{ISSUE_LINE}}</text>
  <text x="1128" y="582" font-family="{{FONT_FAMILY}}" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="end">www.pro-curo.com</text>
</svg>
